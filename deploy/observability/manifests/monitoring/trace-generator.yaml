# =============================================================================
# k6 Trace Generator
# Generates synthetic OTLP traces and sends them to Alloy-OTel so the backend
# services' traffic shows up in the Tempo → Grafana trace pipeline even in a
# low-traffic dev cluster. Pointed at the existing alloy OTLP/grpc endpoint.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k6-trace-generator
  namespace: observability
  labels:
    app: k6-trace-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k6-trace-generator
  template:
    metadata:
      labels:
        app: k6-trace-generator
    spec:
      containers:
        - name: k6-tracing
          image: ghcr.io/grafana/xk6-client-tracing:v0.0.7
          env:
            # Send traces to Alloy OTLP/gRPC endpoint (4317).
            - name: ENDPOINT
              value: "alloy.observability.svc.cluster.local:4317"
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
      restartPolicy: Always

---
apiVersion: v1
kind: Service
metadata:
  name: k6-trace-generator
  namespace: observability
spec:
  selector:
    app: k6-trace-generator
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  type: ClusterIP
