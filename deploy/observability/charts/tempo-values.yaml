# =============================================================================
# Tempo Helm Values
# Chart: grafana-community/tempo v2.4.0 (stable intermediate version)
# Trace storage only. Services push OTLP/HTTP straight to :4318.
# =============================================================================

# Cấu hình pod/container (image, resources, env) — nằm trong nhánh `tempo.*`.
tempo:
  repository: grafana/tempo
  pullPolicy: IfNotPresent

  # Tempo 2.x allocates 1 GiB ballast by default → OOMKill trên box 8 GB.
  memBallastSizeMbs: 0
  extraEnv:
    - name: GOMEMLIMIT
      value: 400MiB

  reportingEnabled: false
  retention: 24h

  # Bật metrics generator để dùng TraceQL |rate(), |histogram(), ...
  # Chi phí: ~100-200MB RAM, chấp nhận được trên box 8 GB.
  metricsGenerator:
    enabled: true

  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

# =============================================================================
# CẤU HÌNH LÕI TEMPO (BẮT BUỘC PHẢI Ở CẤP GỐC — ROOT LEVEL)
# Helm chart `grafana/tempo` đọc toàn bộ config YAML từ khóa `config:` ở gốc,
# không phải bên trong `tempo:`. Nếu để sai cấp, chart bỏ qua im lặng.
# =============================================================================
config: |
  server:
    http_listen_port: 3200
    grpc_listen_port: 9095

  distributor:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
          http:
            endpoint: "0.0.0.0:4318"

  memberlist:
    abort_if_cluster_join_fails: false
    bind_port: 7946
    join_members:
      - 127.0.0.1:7946

  metrics_generator:
    storage:
      path: /var/tempo/wal
    local_blocks_storage:
      path: /var/tempo/wal/blocks
    registry:
      external_labels:
        source: "tempo"
    ring:
      kvstore:
        store: memberlist

  ingester:
    lifecycler:
      ring:
        kvstore:
          store: memberlist
        replication_factor: 1

  storage:
    trace:
      backend: local
      local:
        path: /var/tempo/traces
      wal:
        path: /var/tempo/wal

# =============================================================================
# Kubernetes Native Resource Configurations (cấp gốc, không nằm trong `config:`)
# =============================================================================
persistence:
  enabled: true
  storageClassName: local-path
  size: 2Gi

service:
  enabled: true
  type: ClusterIP
  ports:
    - name: http
      port: 3200
      targetPort: 3200
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318

# Prometheus đã scrape service; self-metrics Tempo không cần.
serviceMonitor:
  enabled: false
