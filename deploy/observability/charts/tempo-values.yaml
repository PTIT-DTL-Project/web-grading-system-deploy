# =============================================================================
# Tempo Helm Values
# Chart: grafana/tempo v1.21.1 (app 2.7.1)
# Trace storage only. Services push OTLP/HTTP straight to :4318.
# =============================================================================

# Chart schema: image and resources live under `tempo.*`. Top-level keys are
# ignored by this chart, so a top-level `resources:` block silently leaves the
# pod unbounded.
tempo:
  repository: grafana/tempo
  tag: 2.7.1
  pullPolicy: IfNotPresent

  # Tempo 2.x allocates a 1 GiB ballast by default. That alone is twice the
  # container limit below, so the default guarantees an OOMKill / node pressure.
  memBallastSizeMbs: 0
  # Go soft memory limit: GC earlier instead of letting the heap reach 512Mi.
  extraEnv:
    - name: GOMEMLIMIT
      value: 400MiB

  reportingEnabled: false
  retention: 24h

  # Span metrics need the metrics generator plus a remote-write target; both
  # cost CPU/RAM we do not have here. HTTP metrics come from Prometheus.
  metricsGenerator:
    enabled: false

  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

# OTLP receivers phải bind 0.0.0.0 để accessible từ namespace khác (web-grading).
# OpenTelemetry Collector >=v0.112.0 (dùng trong grafana/tempo 1.21.1) mặc định
# bind localhost thay vì 0.0.0.0 (breaking change, xem https://github.com/grafana/tempo/issues/4465).
# Nếu không khai báo endpoint tường minh, receiver chỉ lắng nghe localhost
# → connection refused từ bên ngoài pod, mặc dù Service và DNS vẫn đúng.
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

# Tempo HTTP server phải listen port 3200 (không phải 3100 mặc định của chart)
# để khớp với Grafana datasource url: http://tempo.observability.svc.cluster.local:3200
server:
  http_listen_port: 3200
  grpc_listen_port: 9095

persistence:
  enabled: true
  storageClassName: local-path
  size: 2Gi

# Service phải được bật rõ ràng và khai báo port 4318 (OTLP HTTP) để các backend
# ở namespace khác (web-grading) có thể resolve DNS: tempo.observability.svc.cluster.local:4318
service:
  enabled: true
  type: ClusterIP
  ports:
    - name: http
      port: 3200
      targetPort: 3200
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318

# Prometheus already scrapes the services; Tempo self-metrics are not needed.
serviceMonitor:
  enabled: false
