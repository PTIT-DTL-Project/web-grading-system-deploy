# =============================================================================
# kube-prometheus-stack Helm Values (Lite: Prometheus + Grafana only)
# Chart: prometheus-community/kube-prometheus-stack v72.6.2
# Provides: Prometheus (metrics TSDB) + Grafana (UI).
# kube-state-metrics, Alertmanager are DISABLED. Node Exporter is ENABLED.
# =============================================================================

defaultRules:
  create: false

grafana:
  enabled: true
  defaultDashboardsEnabled: false
  defaultDatasourcesEnabled: true   # auto-create Prometheus datasource

  sidecar:
    dashboards:
      enabled: false
    datasources:
      enabled: true                 # read ConfigMap datasources defined below
      label: grafana_datasource
      labelValue: "1"

  persistence:
    enabled: true
    size: 2Gi
    storageClassName: local-path

  resources:
    limits: { cpu: 500m, memory: 512Mi }
    requests: { cpu: 100m, memory: 256Mi }

  adminUser: admin
  # adminPassword is injected at install time via --set (see install.sh).
  # Don't hardcode it here.

  # --- Datasource provisioning ---
  # Prometheus is auto-provisioned by defaultDatasourcesEnabled: true.
  # Tempo is added explicitly here so Grafana can query traces.
  additionalDataSources:
    - name: Tempo
      type: tempo
      access: proxy
      url: http://tempo.observability.svc.cluster.local:3200
      editable: true

  grafana.ini:
    server:
      root_url: "%(protocol)s://%(domain)s/"
      serve_from_sub_path: true
      domain: "${GRAFANA_DOMAIN:-web-dev1-grafana.vucongtuanduong.dpdns.org}"
    auth:
      anonymous:
        enabled: false
    users:
      allow_sign_up: false

# --- Prometheus ---
prometheus:
  enabled: true
  prometheusSpec:
    enableRemoteWriteReceiver: true
    storageClassName: local-path
    size: 8Gi
    retention: 7d
    # Scrape Spring Boot backend services in the web-grading namespace.
    # Each backend pod exposes /actuator/prometheus on its (single) HTTP
    # container port. Pod-SD + the prometheus ServiceAccount token discover
    # them; the token + cluster CA are mounted by the chart automatically.
    additionalScrapeConfigs: |
      - job_name: "backend-services"
        metrics_path: "/actuator/prometheus"
        scheme: http
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - web-grading
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Running
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            regex: .+
            action: keep
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
        honor_labels: true

    service:
      enabled: true
      type: ClusterIP

# --- Node Exporter (host metrics DaemonSet) ---
prometheus-node-exporter:
  enabled: true

# --- kube-state-metrics (disabled — not needed for service-level metrics only) ---
kube-state-metrics:
  enabled: false

# --- Alertmanager (disabled — not needed for metrics + tracing only) ---
alertmanager:
  enabled: false
