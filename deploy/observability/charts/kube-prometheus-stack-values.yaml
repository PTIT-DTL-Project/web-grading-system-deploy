# =============================================================================
# kube-prometheus-stack Helm Values (Lite: Prometheus + Grafana only)
# Chart: prometheus-community/kube-prometheus-stack v92.11.0
# Provides: Prometheus (metrics TSDB) + Grafana (UI).
# kube-state-metrics, Alertmanager, Node Exporter are DISABLED (8 GB RAM box).
# =============================================================================

defaultRules:
  create: false

grafana:
  enabled: true
  defaultDashboardsEnabled: false

  # The datasource ConfigMap is still generated by this chart, but it is mounted
  # straight into the Grafana pod instead of being discovered by the
  # k8s-sidecar container. The sidecar writes the provisioning file after
  # Grafana has already read the directory, so a fresh install can come up with
  # an empty datasource list; it also pulls an extra image from quay.io and
  # needs RBAC to watch ConfigMaps. A direct mount is read at container start
  # and has none of those failure modes.
  # forceDeployDatasources keeps the ConfigMap rendering while the sidecar is off
  # (the template is gated on either one of them).
  forceDeployDatasources: true
  sidecar:
    dashboards:
      enabled: false
    datasources:
      enabled: false
      # Off on purpose: the chart's own provisioning always emits a Prometheus
      # AND an Alertmanager datasource, but alertmanager.enabled is false here,
      # so Grafana would list a dead datasource pointing at a service that does
      # not exist. Both datasources we use are declared explicitly in
      # additionalDataSources below.
      # (Key is singular: defaultDatasourceEnabled; "defaultDatasourcesEnabled"
      # is silently ignored.)
      defaultDatasourceEnabled: false
      label: grafana_datasource
      labelValue: "1"

  persistence:
    enabled: true
    size: 2Gi
    storageClassName: local-path

  resources:
    # Review: 2026-11-10 — tăng từ từ từ 512Mi/500m lên 768Mi/750m vì Grafana
    # hay OOMKilled (CrashLoopRestart) khi query nhiều series từ Prometheus trên
    # box 8 GB đang khít RAM (~6.7–7.1GB/7.6GB). Không nhảy thẳng 1Gi để tránh
    # bó nút nhớ node làm các pod Java khác bị Kill. Sẽ theo dõi rồi cân nhắc
    # tăng thêm sau nếu cần.
    limits: { cpu: 750m, memory: 768Mi }
    requests: { cpu: 200m, memory: 384Mi }

  adminUser: admin
  # adminPassword is injected at install time via --set (see install.sh).
  # Don't hardcode it here.

  # Mount the generated ConfigMap at the exact file path Grafana provisions from.
  # The name follows the chart's fullname helper, which for this deployment is
  # "<release>-kube-prometheus-grafana-datasource"; install.sh fixes the release
  # name to `monitoring`. Renaming the release means updating this value too.
  # Caveat: a subPath mount is not updated in place, so after editing
  # additionalDataSources run
  #   kubectl -n observability rollout restart deploy/monitoring-grafana
  extraConfigmapMounts:
    - name: grafana-datasources
      configMap: '{{ .Release.Name }}-kube-prometheus-grafana-datasource'
      mountPath: /etc/grafana/provisioning/datasources/datasource.yaml
      subPath: datasource.yaml
      readOnly: true

  # --- Datasource provisioning ---
  # Both datasources are declared here (and only here) so the set is explicit:
  # Prometheus for metrics, Tempo for traces. Prometheus must stay isDefault so
  # Explore and new panels work without picking a datasource manually.
  additionalDataSources:
    - name: Prometheus
      type: prometheus
      uid: prometheus
      access: proxy
      url: http://monitoring-kube-prometheus-prometheus.observability.svc.cluster.local:9090
      isDefault: true
      editable: false
      jsonData:
        httpMethod: POST
        # Matches prometheusSpec.scrapeInterval (30s) so graphs are step-correct.
        timeInterval: 30s
    - name: Tempo
      type: tempo
      uid: tempo
      access: proxy
      url: http://tempo.observability.svc.cluster.local:3200
      editable: false
      jsonData:
        # Link to Prometheus for "View related metrics" button in trace view.
        tracesToMetrics:
          datasourceUid: prometheus
        # Grafana Tempo datasource stream TraceQL search bằng gRPC trên chính
        # URL datasource (port 3200, h2c) — plugin không có setting
        # grpc.address. Tempo phải chạy với stream_over_http_enabled: true
        # (đặt qua tempo.streamOverHttpEnabled trong tempo-values.yaml), nếu
        # không port 3200 trả HTTP/1.1 và Grafana báo:
        #   "http2: frame too large ... looked like an HTTP/1.1 header"
        # Metrics streaming tắt để giảm tải; | rate() vẫn chạy qua query_range.
        streamingEnabled:
          search: true
          metrics: false

  # Helm does NOT expand ${...} inside values files: the old literal
  # "${GRAFANA_DOMAIN:-...}" became Grafana's domain verbatim and broke
  # redirects/absolute URLs. Keep this host in sync with the ingress manifest.
  grafana.ini:
    server:
      domain: web-dev1-grafana.vucongtuanduong.dpdns.org
      root_url: "https://%(domain)s/"
      serve_from_sub_path: false
    # grafana.ini sections are flat maps of key: value. A nested map
    # (auth: { anonymous: { enabled: false } }) renders as
    # `anonymous = map[enabled:false]`, i.e. an unknown option — grafana
    # ignores it instead of disabling anonymous access.
    auth.anonymous:
      enabled: false
    users:
      allow_sign_up: false

# --- prometheus-operator ---
# The chart leaves the operator unbounded by default. It only reconciles a
# handful of CRs here (one Prometheus, one Grafana), so a small ceiling is
# enough and keeps the "every workload on this node declares limits" rule.
prometheusOperator:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 200m, memory: 256Mi }

# --- Prometheus ---
prometheus:
  enabled: true
  prometheusSpec:
    enableRemoteWriteReceiver: true
    storageClassName: local-path
    size: 2Gi
    retention: 3d
    # Hard stop before the 2Gi PVC fills (Prometheus keeps head chunks too).
    retentionSize: "1500MB"
    # Scrape Spring Boot backend services in the web-grading namespace.
    # Pod-SD uses Prometheus's own ServiceAccount for the Kubernetes API; that
    # credential must NOT be attached to the scrape requests. With
    # bearer_token_file the gateway's reactive resource-server filter rejects
    # the invalid Bearer token with 401 before permitAll() on
    # /actuator/prometheus can apply, so gateway metrics stayed dark.
    additionalScrapeConfigs: |
      - job_name: "backend-services"
        metrics_path: "/actuator/prometheus"
        scheme: http
        scrape_interval: 30s
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - web-grading
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: "api-gateway|course-service|executor-service|result-service|submission-service|ai-assistant-service"
            action: keep
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Running
            action: keep
          - source_labels: [__meta_kubernetes_pod_ready]
            regex: "true"
            action: keep
          # Only the application HTTP port: executor's dind sidecar exposes
          # 2375 and Keycloak/RustFS pods are excluded by the app-label filter.
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            regex: "8080|8081|8082|8083|8084|8086"
            action: keep
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: service

    service:
      enabled: true
      type: ClusterIP

    resources:
      limits: { cpu: 500m, memory: 768Mi }
      requests: { cpu: 100m, memory: 256Mi }

# --- Kubelet / cAdvisor ---
# cAdvisor defaults to a 10s scrape, which is needless write amplification on
# one node. Container CPU/memory are still fresh at 30s.
kubelet:
  serviceMonitor:
    interval: 30s
    cAdvisorInterval: 30s

# --- Control-plane components ---
# k3s runs these inside the k3s server process, not as separately scrapeable
# pods. Leaving them enabled creates permanently-down targets and error noise.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false

# --- Node Exporter (disabled — host metrics not needed on 8 GB box) ---
# Chart 72.x gates this subchart on `nodeExporter.enabled` (camelCase — see
# Chart.yaml dependencies[].condition). `prometheus-node-exporter` is only the
# subchart's own values namespace, so `prometheus-node-exporter.enabled: false`
# was silently ignored and the DaemonSet kept deploying (seen 2026-11-08: the
# node-exporter pod was still running next to this supposedly Lite stack).
nodeExporter:
  enabled: false

# --- kube-state-metrics (disabled — not needed for service-level metrics only) ---
# Same camelCase gating rule as nodeExporter above: `kube-state-metrics.enabled`
# does nothing on chart 72.x, `kubeStateMetrics.enabled` is the real switch.
kubeStateMetrics:
  enabled: false

# --- Alertmanager (disabled — not needed for metrics + tracing only) ---
alertmanager:
  enabled: false
