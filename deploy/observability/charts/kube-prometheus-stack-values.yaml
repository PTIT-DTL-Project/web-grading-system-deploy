# =============================================================================
# kube-prometheus-stack Helm Values (Lite: Prometheus + Grafana only)
# Chart: prometheus-community/kube-prometheus-stack v72.6.2
# Provides: Prometheus (metrics TSDB) + Grafana (UI).
# kube-state-metrics, Alertmanager, Node Exporter are DISABLED (8 GB RAM box).
# =============================================================================

defaultRules:
  create: false

grafana:
  enabled: true
  defaultDashboardsEnabled: false

  sidecar:
    dashboards:
      enabled: false
    datasources:
      enabled: true
      # Provision the Prometheus datasource. The kube-prometheus-stack key is
      # singular (defaultDatasourceEnabled); "defaultDatasourcesEnabled" is
      # silently ignored.
      defaultDatasourceEnabled: true
      label: grafana_datasource
      labelValue: "1"
    # The datasource sidecar is the only always-on sidecar; bound it too.
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { cpu: 50m, memory: 64Mi }

  persistence:
    enabled: true
    size: 2Gi
    storageClassName: local-path

  resources:
    limits: { cpu: 500m, memory: 512Mi }
    requests: { cpu: 100m, memory: 256Mi }

  adminUser: admin
  # adminPassword is injected at install time via --set (see install.sh).
  # Don't hardcode it here.

  # --- Datasource provisioning ---
  # Prometheus is auto-provisioned by defaultDatasourcesEnabled: true.
  # Tempo is added explicitly here so Grafana can query traces.
  additionalDataSources:
    - name: Tempo
      type: tempo
      access: proxy
      url: http://tempo.observability.svc.cluster.local:3200
      editable: true

  # Helm does NOT expand ${...} inside values files: the old literal
  # "${GRAFANA_DOMAIN:-...}" became Grafana's domain verbatim and broke
  # redirects/absolute URLs. Keep this host in sync with the ingress manifest.
  grafana.ini:
    server:
      domain: web-dev1-grafana.vucongtuanduong.dpdns.org
      root_url: "https://%(domain)s/"
      serve_from_sub_path: false
    auth:
      anonymous:
        enabled: false
    users:
      allow_sign_up: false

# --- Prometheus ---
prometheus:
  enabled: true
  prometheusSpec:
    enableRemoteWriteReceiver: true
    storageClassName: local-path
    size: 2Gi
    retention: 3d
    # Hard stop before the 2Gi PVC fills (Prometheus keeps head chunks too).
    retentionSize: "1500MB"
    # Scrape Spring Boot backend services in the web-grading namespace.
    # Pod-SD uses Prometheus's own ServiceAccount for the Kubernetes API; that
    # credential must NOT be attached to the scrape requests. With
    # bearer_token_file the gateway's reactive resource-server filter rejects
    # the invalid Bearer token with 401 before permitAll() on
    # /actuator/prometheus can apply, so gateway metrics stayed dark.
    additionalScrapeConfigs: |
      - job_name: "backend-services"
        metrics_path: "/actuator/prometheus"
        scheme: http
        scrape_interval: 30s
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - web-grading
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: "api-gateway|course-service|executor-service|result-service|submission-service|ai-assistant-service"
            action: keep
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Running
            action: keep
          - source_labels: [__meta_kubernetes_pod_ready]
            regex: "true"
            action: keep
          # Only the application HTTP port: executor's dind sidecar exposes
          # 2375 and Keycloak/RustFS pods are excluded by the app-label filter.
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            regex: "8080|8081|8082|8083|8084|8086"
            action: keep
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: service

    service:
      enabled: true
      type: ClusterIP

    resources:
      limits: { cpu: 500m, memory: 768Mi }
      requests: { cpu: 100m, memory: 256Mi }

# --- Kubelet / cAdvisor ---
# cAdvisor defaults to a 10s scrape, which is needless write amplification on
# one node. Container CPU/memory are still fresh at 30s.
kubelet:
  serviceMonitor:
    interval: 30s
    cAdvisorInterval: 30s

# --- Control-plane components ---
# k3s runs these inside the k3s server process, not as separately scrapeable
# pods. Leaving them enabled creates permanently-down targets and error noise.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false

# --- Node Exporter (disabled — host metrics not needed on 8 GB box) ---
prometheus-node-exporter:
  enabled: false

# --- kube-state-metrics (disabled — not needed for service-level metrics only) ---
kube-state-metrics:
  enabled: false

# --- Alertmanager (disabled — not needed for metrics + tracing only) ---
alertmanager:
  enabled: false
