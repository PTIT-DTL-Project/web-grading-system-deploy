# =============================================================================
# Loki Helm Values - log aggregation (Single Binary / Monolithic)
# Chart: grafana/loki v7.0.0 (Loki 3.6.7)
# Log shipping is handled by the Alloy daemon already deployed by this stack.
# =============================================================================

# Helm repo version pinned in install.sh; this file holds the overrides.
deploymentMode: SingleBinary

singleBinary:
  replicas: 1
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  persistence:
    enabled: true
    size: 5Gi
    storageClassName: local-path

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  compactor:
    delete_request_store: filesystem
    retention_enabled: true
  limits_config:
    ingestion_rate_mb: 10
    ingestion_burst_size_mb: 20
    max_entries_limit_per_query: 10000
    max_global_streams_per_user: 10000
    per_stream_rate_limit: 10MB
    per_stream_rate_limit_burst: 20MB
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    retention_period: 168h

lokiCanary:
  enabled: false

gateway:
  enabled: false
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

chunksCache:
  enabled: false
resultsCache:
  enabled: false

monitoring:
  selfMonitoring:
    enabled: false
    config:
      serviceMonitor:
        enabled: false
      volume:
        enabled: false

test:
  enabled: false