apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  namespace: web-grading
  labels:
    app: kafka-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-ui
  template:
    metadata:
      labels:
        app: kafka-ui
    spec:
      containers:
        - name: kafka-ui
          # Pin 2026-11-11: `latest` = v1.5.0 (index digest
          # sha256:7cda86a33344160309fdb65146332e4da65db81a945614f2fe32e210803f6fd1,
          # release 2026-04-20). With `latest` + IfNotPresent a node keeps
          # whatever build it pulled first, so the running version was
          # undefined. Bump deliberately, never with `latest`.
          image: ghcr.io/kafbat/kafka-ui:v1.5.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: kafka-aiven-credentials
                optional: true
          env:
            # Kafka UI maps flat env vars onto spring properties.
            - name: KAFKA_CLUSTERS_0_NAME
              value: aiven-grading
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              valueFrom:
                secretKeyRef:
                  name: kafka-aiven-credentials
                  key: bootstrap-servers
                  optional: true
            - name: KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL
              value: SASL_SSL
            - name: KAFKA_CLUSTERS_0_PROPERTIES_SASL_MECHANISM
              value: SCRAM-SHA-256
            - name: KAFKA_CLUSTERS_0_PROPERTIES_SASL_JAAS_CONFIG
              value: 'org.apache.kafka.common.security.scram.ScramLoginModule required username="$(username)" password="$(password)";'
            - name: KAFKA_CLUSTERS_0_PROPERTIES_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM
              value: https
            - name: KAFKA_CLUSTERS_0_PROPERTIES_SSL_TRUSTSTORE_TYPE
              value: PEM
            - name: KAFKA_CLUSTERS_0_PROPERTIES_SSL_TRUSTSTORE_LOCATION
              value: /etc/kafka/secrets/ca.pem
          volumeMounts:
            - name: kafka-ca
              mountPath: /etc/kafka/secrets
              readOnly: true
          resources:
            # Request hạ từ 256Mi xuống 128Mi: request không làm giảm RAM thực
            # nhưng đang giữ chỗ vô ích, khiến scheduler coi node 8 GB đã đầy
            # và các pod Java khác khó được xếp lịch sau khi restart. Heap vẫn
            # do limit 512Mi quyết định (25% ≈ 128Mi), không cần thêm JAVA_OPTS.
            # Khi không cần xem topic: kubectl -n web-grading scale deploy/kafka-ui --replicas=0
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 512Mi
              cpu: 500m
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
      dnsPolicy: "None"
      dnsConfig:
        nameservers:
          - 8.8.8.8
        searches:
          - aivencloud.com
      volumes:
        - name: kafka-ca
          secret:
            secretName: kafka-aiven-credentials
            optional: true
            items:
              - key: ca.pem
                path: ca.pem
