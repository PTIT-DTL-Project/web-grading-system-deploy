apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway
  namespace: web-grading
spec:
  ingressClassName: traefik
  rules:
    - host: web-dev2-api.vucongtuanduong.dpdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grading-api-gateway
                port:
                  number: 8080
