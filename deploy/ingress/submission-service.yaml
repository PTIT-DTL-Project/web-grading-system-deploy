apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: submission-service
  namespace: web-grading
spec:
  ingressClassName: traefik
  rules:
  - host: web-dev1-submission.vucongtuanduong.dpdns.org
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: grading-submission-service
            port:
              number: 8082
