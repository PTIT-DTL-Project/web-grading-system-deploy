apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: web-grading
  labels:
    app: rustfs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
    spec:
      containers:
        - name: rustfs
          image: rustfs/rustfs:latest
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          ports:
            - containerPort: 9000
            - containerPort: 9001
          env:
            - name: RUSTFS_ROOT_USER
              value: minioadmin
            - name: RUSTFS_ROOT_PASSWORD
              value: minioadmin
            - name: RUSTFS_NOTIFY_ENABLE
              value: "on"
            - name: RUSTFS_NOTIFY_WEBHOOK_ENABLE_PRIMARY
              value: "on"
            - name: RUSTFS_NOTIFY_WEBHOOK_ENDPOINT_PRIMARY
              value: "http://submission-service:8082/api/v1/submissions/webhook/upload-complete"
            - name: RUSTFS_NOTIFY_WEBHOOK_QUEUE_DIR_PRIMARY
              value: /tmp/rustfs-events
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rustfs-pvc
